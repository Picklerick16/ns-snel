<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snel">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Snel · treinplanner</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14202e;--mut:#627080;--line:#e1e6ec;--ns:#ffc917;--blue:#0063d3;--red:#d62828;--green:#1f8a4c;--orange:#c86b00}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--card:#18212b;--ink:#e8edf2;--mut:#93a1b0;--line:#26323e;--blue:#4c9bff;--red:#ff6b6b;--green:#4fc27e;--orange:#ffab4c}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
header{background:#0b1a3a;color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header h1{font-size:20px;margin:0;font-weight:750;letter-spacing:-.01em}header .dot{width:12px;height:12px;border-radius:50%;background:var(--ns)}
header button{margin-left:auto;background:none;border:0;color:#cfd8e6;font-size:15px}
main{max-width:560px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom) + 40px)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:16px 4px 8px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;position:relative}
.field{position:relative;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 52px 6px 0}
.field.to{border-bottom:0}.field label{width:44px;color:var(--mut);font-size:14px;flex:none}
.field input{flex:1;border:0;background:transparent;color:var(--ink);font-size:17px;padding:8px 0;outline:none;min-width:0}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-size:17px;flex:none}
.swap{position:absolute;right:12px;top:42px;z-index:2}
.near{border:0;background:none;color:var(--blue);font-size:13px;padding:4px 6px;flex:none}
.sug{position:absolute;left:44px;right:-4px;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:15;box-shadow:0 8px 24px #0004;max-height:330px;overflow:auto}
.sug .sec{padding:6px 12px 2px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);border:0}
.sug .opt{display:flex;align-items:center;gap:8px;padding:10px 6px 10px 12px;border-top:1px solid var(--line)}
.sug .opt span{flex:1}.sug small{color:var(--mut)}
.star{border:0;background:none;font-size:19px;color:var(--mut);padding:2px 8px;line-height:1}.star[aria-pressed=true]{color:#e6a800}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row input[type=time]{font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--card)}
.chip.fav{border-color:#e6a800}
.row .right{margin-left:auto}
.slider{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--mut)}.slider input{flex:1}.slider b{color:var(--ink);min-width:52px;text-align:right}
.go{width:100%;margin-top:12px;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:650}
.go:disabled{opacity:.6}
.routes{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.bar2{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px;margin:6px 4px 10px}.bar2 .err{color:var(--red)}
.bar2 button{margin-left:auto}
.res .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.res .tt{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.res .meta{margin-left:auto;color:var(--mut);font-size:14px;text-align:right}
.soon{font-size:13px;color:var(--blue);font-weight:650}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.b{font-size:12.5px;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.b.gain{background:#1f8a4c22;border-color:var(--green);color:var(--green);font-weight:650}.b.run{background:#d6282822;border-color:var(--red);color:var(--red);font-weight:650}
.b.warn{background:#c86b0022;border-color:var(--orange);color:var(--orange);font-weight:650}.b.ns{color:var(--mut)}
.legs{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.leg{display:grid;grid-template-columns:52px 14px 1fr auto;column-gap:8px;font-size:15px}
.leg .t{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}.leg .t s{color:var(--mut);font-weight:400;font-size:12px;display:block;line-height:1}
.delay{color:var(--red);font-size:12px;font-weight:700;margin-left:2px}
.leg .bar{position:relative}.leg .bar::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:4px;background:var(--ns);border-radius:2px}
.leg .bar.w::before{background:repeating-linear-gradient(var(--mut) 0 4px,transparent 4px 8px)}
.trk{font-size:13px;border:1.5px solid var(--blue);color:var(--blue);border-radius:6px;padding:0 6px;height:22px;align-self:center;font-weight:650;white-space:nowrap}
.trk.chg{border-color:var(--orange);color:var(--orange)}
.train{grid-column:3/5;color:var(--mut);font-size:13.5px;padding:2px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 9px}
.xfer{margin:4px 0 6px 60px;font-size:13.5px;color:var(--mut)}.xfer.run{color:var(--red);font-weight:600}.xfer.near{color:var(--green);font-weight:600}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.cfg input{width:100%;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.cfg p{font-size:13.5px;color:var(--mut);margin:6px 0}
.mode{background:#0063d31a;border:1px solid var(--blue);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.mode button{margin-left:auto}
.trip .top{display:flex;gap:8px;align-items:baseline}.trip .tt{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.trip .sub{color:var(--mut);font-size:13.5px}.trip .x{margin-left:auto}
.more{display:flex;gap:8px;justify-content:center;margin:4px 0 12px}
.hint{color:var(--mut);font-size:13px;margin:2px 4px 12px}
</style>
</head>
<body>
<header><span class="dot"></span><h1>Snel</h1><button id="cfgBtn" aria-expanded="false">Instellingen</button></header>
<main>
  <div class="card cfg" id="cfg" hidden>
    <b>Proxy-adres</b>
    <p>Het adres van je Cloudflare Worker, bijvoorbeeld https://ns-snel.jouwnaam.workers.dev</p>
    <input id="proxy" inputmode="url" autocomplete="off" placeholder="https://ns-snel.….workers.dev">
    <p id="platInfo"></p>
  </div>

  <div class="card" id="form">
    <div class="field from"><label for="from">Van</label><input id="from" autocomplete="off" placeholder="Vertrekstation" enterkeyhint="next"><button class="near" id="near" type="button">Dichtbij</button><div class="sug" id="sugFrom" hidden></div></div>
    <button class="icon swap" id="swap" aria-label="Wissel van en naar">⇅</button>
    <div class="field to"><label for="to">Naar</label><input id="to" autocomplete="off" placeholder="Aankomststation" enterkeyhint="search"><div class="sug" id="sugTo" hidden></div></div>
    <div class="row">
      <button class="chip" id="now" aria-pressed="true">Nu</button>
      <input type="time" id="time" aria-label="Vertrektijd">
      <button class="chip right" id="favRoute" aria-pressed="false">☆ Route</button>
    </div>
    <div class="slider"><span>Min. overstap</span><input type="range" id="minT" min="0" max="6" step="1"><b id="minTv"></b></div>
    <button class="go" id="go">Plan snelste route</button>
  </div>

  <div class="routes" id="routes"></div>
  <section id="tripsSec" hidden><h2>Mijn reizen</h2><div id="trips"></div></section>
  <div id="mode"></div>
  <div class="bar2" id="bar"></div>
  <div id="out"></div>
  <div class="more" id="more" hidden><button class="chip" id="earlier">← Eerder</button><button class="chip" id="later">Later →</button></div>
</main>
<script type="module">
import { makeApi, plan, depOf, arrOf, transfers, platforms, refreshLeg } from './planner.js';

const $ = s => document.querySelector(s);
const ls = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const hm = d => d ? d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : '–';
const dur = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mins = (a, b) => Math.round((b - a) / 60000);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ---------- saved state ----------
let api = null, stations = [], byCode = new Map();
const sel = { from: ls.get('from', null), to: ls.get('to', null) };
let favStations = ls.get('favStations', []);      // station codes
let recentStations = ls.get('recentStations', []); // station codes, newest first
let favRoutes = ls.get('favRoutes', []);          // [{from:code,to:code}]
let inTrain = null, last = null, lastQuery = null, refreshTimer = null;

// what the app learned about platforms survives a restart
for (const [k, v] of ls.get('platforms', [])) platforms.set(k, v);
const savePlatforms = () => ls.set('platforms', [...platforms].slice(-4000));

// dates inside saved itineraries come back as strings
function reviveItin(it) {
  const D = v => (v ? new Date(v) : null);
  for (const l of it.legs) {
    for (const p of [l.from, l.to]) { p.time = D(p.time); p.planned = D(p.planned); }
    for (const s of l.stops || []) { s.arr = D(s.arr); s.dep = D(s.dep); }
  }
  return it;
}

// ---------- settings ----------
$('#proxy').value = ls.get('proxy', '');
$('#cfg').hidden = !!ls.get('proxy', '');
$('#cfgBtn').onclick = () => { const h = !$('#cfg').hidden; $('#cfg').hidden = h; $('#cfgBtn').setAttribute('aria-expanded', !h);
  $('#platInfo').textContent = `Snel kent nu ${Math.round(platforms.size / 2)} overstappen waarvan het weet of ze op hetzelfde perron zijn.`; };
$('#proxy').onchange = () => { ls.set('proxy', $('#proxy').value.trim()); api = null; init(); };

const minT = $('#minT');
minT.value = ls.get('minT', 2);
const showMin = () => { $('#minTv').textContent = `${minT.value} min`; };
minT.oninput = () => { showMin(); ls.set('minT', +minT.value); };
showMin();

const nowBtn = $('#now'), timeIn = $('#time');
const isNow = () => nowBtn.getAttribute('aria-pressed') === 'true';
const setNow = on => { nowBtn.setAttribute('aria-pressed', on); if (on) timeIn.value = hm(new Date()); };
nowBtn.onclick = () => setNow(true);
timeIn.oninput = () => nowBtn.setAttribute('aria-pressed', false);
setNow(true);

function bar(text, { err = false, refresh = false } = {}) {
  const b = $('#bar'); b.replaceChildren();
  const s = el('span', err ? 'err' : '', text); b.append(s);
  if (refresh) { const r = el('button', 'chip', '↻ Vernieuwen'); r.onclick = () => go({ again: true }); b.append(r); }
}

async function init() {
  const base = ls.get('proxy', '');
  if (!base) { bar('Vul eerst bij Instellingen het adres van je proxy in.'); $('#cfg').hidden = false; return; }
  api = makeApi(base);
  try {
    if (!stations.length) bar('Stations laden…');
    stations = (await api.loadStations()).filter(s => s.land === 'NL');
    bar('');
    byCode = new Map(stations.map(s => [s.code, s]));
    if (sel.from) $('#from').value = sel.from.name;
    if (sel.to) $('#to').value = sel.to.name;
    syncFavRoute(); renderRoutes(); renderTrips(true);
    restoreLast();
  } catch (e) { bar('Kan de stations niet laden: ' + e.message + '. Klopt het proxy-adres?', { err: true }); }
}

// ---------- station picker: favourites and recent first ----------
function pushRecentStation(code) { recentStations = [code, ...recentStations.filter(c => c !== code)].slice(0, 8); ls.set('recentStations', recentStations); }
function toggleFavStation(code) {
  favStations = favStations.includes(code) ? favStations.filter(c => c !== code) : [...favStations, code];
  ls.set('favStations', favStations);
}

function stationPicker(input, box, which) {
  let top = null;
  const pick = s => { sel[which] = s; ls.set(which, s); input.value = s.name; box.hidden = true; pushRecentStation(s.code); syncFavRoute(); };
  const row = s => {
    const d = el('div', 'opt'); const n = el('span', '', s.name); n.append(el('small', '', '  ' + s.code)); d.append(n);
    const st = el('button', 'star', favStations.includes(s.code) ? '★' : '☆');
    st.type = 'button'; st.setAttribute('aria-pressed', favStations.includes(s.code)); st.setAttribute('aria-label', 'Favoriet station');
    st.onpointerdown = e => { e.preventDefault(); e.stopPropagation(); toggleFavStation(s.code); run(); };
    d.append(st);
    d.onpointerdown = e => { if (e.target === st) return; e.preventDefault(); pick(s); };
    return d;
  };
  const run = () => {
    const q = input.value.trim().toLowerCase();
    const parts = [];
    if (!q || (sel[which] && input.value === sel[which].name)) {
      // empty field: favourites, then recent ones
      const favs = favStations.map(c => byCode.get(c)).filter(Boolean);
      const recs = recentStations.filter(c => !favStations.includes(c)).map(c => byCode.get(c)).filter(Boolean);
      if (favs.length) parts.push(['Favorieten', favs]);
      if (recs.length) parts.push(['Recent', recs]);
      top = favs[0] || recs[0] || null;
    } else {
      const boost = c => favStations.includes(c) ? -2 : recentStations.includes(c) ? -1 : 0;
      const hits = stations.map(s => {
        const names = [s.name, ...s.alt].map(n => n.toLowerCase());
        const score = names.some(n => n.startsWith(q)) || s.code.toLowerCase() === q ? 0 : names.some(n => n.includes(q)) ? 1 : 9;
        return { s, score: score === 9 ? 9 : score * 3 + boost(s.code) };
      }).filter(h => h.score < 9).sort((a, b) => a.score - b.score || a.s.name.length - b.s.name.length || a.s.name.localeCompare(b.s.name)).slice(0, 8);
      top = hits[0]?.s || null;
      if (hits.length) parts.push([null, hits.map(h => h.s)]);
    }
    box.replaceChildren(...parts.flatMap(([title, list]) => [...(title ? [el('div', 'sec', title)] : []), ...list.map(row)]));
    box.hidden = !parts.length;
  };
  input.oninput = () => { sel[which] = null; run(); };
  input.onfocus = () => { input.select(); run(); };
  input.onkeydown = e => { if (e.key === 'Enter' && top) { e.preventDefault(); pick(top); input.blur(); if (which === 'to') go(); } };
  input.onblur = () => setTimeout(() => { box.hidden = true; if (!sel[which] && input.value.trim() && top) pick(top); }, 150);
}
stationPicker($('#from'), $('#sugFrom'), 'from');
stationPicker($('#to'), $('#sugTo'), 'to');

$('#swap').onclick = () => { [sel.from, sel.to] = [sel.to, sel.from]; ls.set('from', sel.from); ls.set('to', sel.to);
  $('#from').value = sel.from?.name || ''; $('#to').value = sel.to?.name || ''; syncFavRoute(); };

// nearest station from the phone's location
$('#near').onclick = () => {
  if (!navigator.geolocation) { bar('Locatie is niet beschikbaar in deze browser.', { err: true }); return; }
  bar('Locatie zoeken…');
  navigator.geolocation.getCurrentPosition(p => {
    const { latitude: la, longitude: lo } = p.coords, k = Math.cos(la * Math.PI / 180);
    let best = null, bd = Infinity;
    for (const s of stations) { if (s.lat == null) continue; const d = (s.lat - la) ** 2 + ((s.lng - lo) * k) ** 2; if (d < bd) { bd = d; best = s; } }
    if (!best) { bar('Geen station gevonden.', { err: true }); return; }
    sel.from = best; ls.set('from', best); $('#from').value = best.name; pushRecentStation(best.code); syncFavRoute();
    bar(`Dichtstbijzijnde station: ${best.name}, ${(Math.sqrt(bd) * 111).toFixed(1)} km.`);
  }, e => bar('Geen locatie: ' + (e.code === 1 ? 'toestemming geweigerd.' : e.message), { err: true }), { enableHighAccuracy: false, timeout: 10000, maximumAge: 120000 });
};

// ---------- favourite and recent routes ----------
const routeKey = (f, t) => `${f}>${t}`;
function syncFavRoute() {
  const on = !!(sel.from && sel.to && favRoutes.some(r => routeKey(r.from, r.to) === routeKey(sel.from.code, sel.to.code)));
  const b = $('#favRoute'); b.setAttribute('aria-pressed', on); b.textContent = on ? '★ Route' : '☆ Route';
}
$('#favRoute').onclick = () => {
  if (!sel.from || !sel.to) { bar('Kies eerst van en naar.', { err: true }); return; }
  const k = routeKey(sel.from.code, sel.to.code);
  favRoutes = favRoutes.some(r => routeKey(r.from, r.to) === k) ? favRoutes.filter(r => routeKey(r.from, r.to) !== k) : [...favRoutes, { from: sel.from.code, to: sel.to.code }];
  ls.set('favRoutes', favRoutes); syncFavRoute(); renderRoutes();
};
function renderRoutes() {
  const rec = ls.get('recent', []).map(x => ({ from: x.from.code, to: x.to.code }));
  const seen = new Set(); const list = [];
  for (const r of [...favRoutes.map(r => ({ ...r, fav: true })), ...rec]) { const k = routeKey(r.from, r.to); if (seen.has(k)) continue; seen.add(k); list.push(r); }
  $('#routes').replaceChildren(...list.slice(0, 8).map(r => {
    const f = byCode.get(r.from), t = byCode.get(r.to); if (!f || !t) return el('span');
    const b = el('button', 'chip' + (r.fav ? ' fav' : ''), `${r.fav ? '★ ' : ''}${f.name} → ${t.name}`);
    b.onclick = () => { sel.from = f; sel.to = t; ls.set('from', f); ls.set('to', t); $('#from').value = f.name; $('#to').value = t.name; syncFavRoute(); setNow(true); go(); };
    return b;
  }));
}

// ---------- search ----------
function when() {
  if (isNow()) return new Date();
  const [h, m] = (timeIn.value || '00:00').split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (d < new Date(Date.now() - 6 * 3600e3)) d.setDate(d.getDate() + 1);
  return d;
}

async function go(opts = {}) {
  if (!api) { await init(); if (!api) return; }
  const { again = false, shift = 0 } = opts;
  let q;
  if (again && lastQuery) q = { ...lastQuery, when: lastQuery.nowMode ? new Date() : lastQuery.when };
  else {
    if (!sel.from || !sel.to) { bar('Kies een vertrek- en aankomststation uit de lijst.', { err: true }); return; }
    if (sel.from.code === sel.to.code) { bar('Vertrek en aankomst zijn hetzelfde.', { err: true }); return; }
    q = { from: sel.from, to: sel.to, when: when(), nowMode: isNow(), minT: +minT.value, base: opts.base || null, after: opts.after || null };
  }
  if (shift) { q.when = new Date(q.when.getTime() + shift * 60000); q.nowMode = false; q.base = null; setNow(false); timeIn.value = hm(q.when); }
  if (q.base && q.nowMode) q.after = new Date();
  if (!again && !q.base) {
    const r = ls.get('recent', []).filter(x => !(x.from.code === q.from.code && x.to.code === q.to.code));
    ls.set('recent', [{ from: q.from, to: q.to }, ...r].slice(0, 6)); renderRoutes();
  }
  lastQuery = q;
  const btn = $('#go'); btn.disabled = true;
  if (!again) $('#out').replaceChildren();
  bar('Zoeken…');
  try {
    const res = await plan(api, q.from, q.to, q.when, q.minT, { base: q.base, after: q.after, onProgress: t => bar(t) });
    last = { ...res, at: new Date() };
    savePlatforms();
    renderResults(res, q.minT);
    ls.set('lastSearch', { q: { from: q.from, to: q.to, when: q.when, nowMode: q.nowMode, minT: q.minT, base: q.base, after: q.after, inTrain }, res: { results: res.results, nsBest: res.nsBest }, at: last.at });
    showUpdated();
    scheduleRefresh();
  } catch (e) { bar('Zoeken mislukt: ' + e.message, { err: true, refresh: true }); }
  finally { btn.disabled = false; }
}
$('#go').onclick = () => { inTrain = null; renderMode(); go(); };
$('#earlier').onclick = () => go({ again: true, shift: -20 });
$('#later').onclick = () => go({ again: true, shift: +20 });

function showUpdated() {
  if (!last) return;
  const ago = mins(last.at, new Date());
  bar(`${last.results.length} routes · bijgewerkt ${ago < 1 ? 'net' : ago + ' min geleden'} (${hm(last.at)})`, { refresh: true });
}

// refresh every minute while the page is open and the search is "now"
function scheduleRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if (document.visibilityState !== 'visible' || !lastQuery) return;
    if (lastQuery.nowMode && mins(last?.at || 0, new Date()) >= 1) go({ again: true }); else showUpdated();
  }, 60000);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (lastQuery?.nowMode && last && mins(last.at, new Date()) >= 1) go({ again: true });
  renderTrips(true);
});

function restoreLast() {
  const s = ls.get('lastSearch', null);
  if (!s || mins(new Date(s.at), new Date()) > 180) return;
  const q = s.q; q.when = new Date(q.when); q.after = q.after ? new Date(q.after) : null;
  if (q.base) q.base = reviveItin(q.base);
  inTrain = q.inTrain || null; renderMode();
  lastQuery = q;
  last = { results: s.res.results.map(reviveItin), nsBest: s.res.nsBest ? reviveItin(s.res.nsBest) : null, at: new Date(s.at) };
  renderResults(last, q.minT); showUpdated(); scheduleRefresh();
  if (q.nowMode && mins(last.at, new Date()) >= 1) go({ again: true });
}

function renderMode() {
  const m = $('#mode'); m.replaceChildren();
  if (!inTrain) return;
  const d = el('div', 'mode', `Je zit in ${inTrain.label}. Ik zoek waar je het best overstapt.`);
  const b = el('button', 'chip', 'Stop');
  b.onclick = () => { inTrain = null; lastQuery = null; renderMode(); };
  d.append(b); m.append(d);
}

// ---------- drawing an itinerary ----------
function timeCell(p) {
  const c = el('span', 't', hm(p.time));
  const d = p.planned && p.time ? mins(p.planned, p.time) : 0;
  if (d > 0) c.append(el('span', 'delay', `+${d}`));
  return c;
}
function trackCell(p) {
  if (!p.track) return el('span');
  const chg = p.plannedTrack && p.plannedTrack !== p.track;
  const t = el('span', 'trk' + (chg ? ' chg' : ''), p.track);
  if (chg) t.title = `was spoor ${p.plannedTrack}`;
  return t;
}
function drawLegs(it, m, { inTrainButtons = true } = {}) {
  const box = el('div', 'legs');
  const tr = transfers(it, m);
  it.legs.forEach((l, i) => {
    const g = el('div', 'leg');
    const w = l.walk ? ' w' : '';
    g.append(timeCell(l.from), el('span', 'bar' + w), el('span', '', l.from.name), trackCell(l.from));
    g.append(el('span'), el('span', 'bar' + w));
    const info = el('span', 'train', l.walk ? l.label : `${l.cat || ''} ${l.direction ? 'richting ' + l.direction : ''}${l.missing ? ' · niet meer gevonden' : ''}`);
    if (l.from.plannedTrack && l.from.plannedTrack !== l.from.track) info.append(el('span', 'b warn', `spoor gewijzigd, was ${l.from.plannedTrack}`));
    if (!l.walk && inTrainButtons) {
      const b = el('button', 'mini', 'Ik zit in deze trein');
      b.onclick = e => { e.stopPropagation(); inTrain = { label: `${l.cat} ${l.train} richting ${l.direction}` }; renderMode();
        go({ base: { legs: it.legs.slice(i), status: 'NORMAL', source: 'ns' }, after: new Date() }); };
      info.append(b);
    }
    g.append(info);
    g.append(timeCell(l.to), el('span', 'bar' + w), el('span', '', l.to.name), trackCell(l.to));
    box.append(g);
    if (i < it.legs.length - 1) {
      const t = tr.find(x => x.at === it.legs[i + 1].from.name);
      if (t) {
        const near = t.kind === 'same' || t.kind === 'cross';
        const x = el('div', 'xfer' + (t.tight ? ' run' : near ? ' near' : ''));
        const where = t.kind === 'same' ? 'zelfde spoor' : t.kind === 'cross' ? 'zelfde perron' : t.kind === 'likely' ? 'waarschijnlijk zelfde perron' : t.tight ? 'rennen' : '';
        x.textContent = `${t.gap} min overstap${t.fromTrack && t.toTrack ? `, spoor ${t.fromTrack} → ${t.toTrack}` : ''}${where ? ' · ' + where : ''}`;
        box.append(x);
      }
    }
  });
  return box;
}

function renderResults(res, m) {
  const out = $('#out'); out.replaceChildren();
  const nsArr = res.nsBest ? arrOf(res.nsBest) : null;
  res.results.forEach((it, idx) => {
    const c = el('div', 'card res');
    const tr = transfers(it, m);
    const gain = nsArr ? mins(arrOf(it), nsArr) : 0;
    const top = el('div', 'top');
    top.append(el('span', 'tt', `${hm(depOf(it))} → ${hm(arrOf(it))}`));
    const until = mins(new Date(), depOf(it));
    if (until >= 0 && until <= 60) top.append(el('span', 'soon', until === 0 ? 'nu' : `over ${until} min`));
    top.append(el('span', 'meta', `${dur(mins(depOf(it), arrOf(it)))} · ${tr.length}× over`));
    const badges = el('div', 'badges');
    if (gain > 0) badges.append(el('span', 'b gain', `${gain} min sneller dan NS`));
    if (it.source === 'ns') badges.append(el('span', 'b ns', 'NS-advies'));
    if (tr.some(t => t.tight)) badges.append(el('span', 'b run', 'krappe overstap'));
    const delay = Math.max(0, ...it.legs.map(l => l.from.planned && l.from.time ? mins(l.from.planned, l.from.time) : 0));
    if (delay > 0) badges.append(el('span', 'b warn', `+${delay} min vertraging`));
    if (it.legs.some(l => l.from.plannedTrack && l.from.plannedTrack !== l.from.track)) badges.append(el('span', 'b warn', 'spoorwijziging'));
    const legs = drawLegs(it, m); legs.hidden = idx > 0;
    const acts = el('div', 'acts'); acts.hidden = idx > 0;
    const save = el('button', 'mini', '★ Bewaar reis');
    save.onclick = e => { e.stopPropagation(); saveTrip(it); save.textContent = '✓ Bewaard'; };
    const share = el('button', 'mini', 'Delen');
    share.onclick = e => { e.stopPropagation(); shareTrip(it); };
    acts.append(save, share);
    c.append(top, badges, legs, acts);
    c.onclick = () => { legs.hidden = !legs.hidden; acts.hidden = legs.hidden; };
    out.append(c);
  });
  $('#more').hidden = !res.results.length || !!(lastQuery && lastQuery.base);
}

function tripText(it) {
  return it.legs.map(l => l.walk ? `Lopen ${hm(l.from.time)}–${hm(l.to.time)}` :
    `${hm(l.from.time)} ${l.from.name} sp. ${l.from.track} → ${hm(l.to.time)} ${l.to.name} sp. ${l.to.track} (${l.cat})`).join('\n');
}
async function shareTrip(it) {
  const text = `Ik ben om ${hm(arrOf(it))} in ${it.legs.at(-1).to.name}.\n\n${tripText(it)}`;
  try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); bar('Reis gekopieerd.'); } }
  catch (e) { if (e.name !== 'AbortError') bar('Delen lukte niet.', { err: true }); }
}

// ---------- saved trips ----------
function savedTrips() { return ls.get('savedTrips', []).map(t => ({ ...t, it: reviveItin(t.it) })); }
function storeTrips(list) { ls.set('savedTrips', list.map(t => ({ id: t.id, it: t.it, checked: t.checked }))); }
function saveTrip(it) {
  const list = savedTrips();
  const id = it.legs.map(l => l.train || 'w').join('-') + '@' + depOf(it).toISOString();
  if (!list.some(t => t.id === id)) list.push({ id, it, checked: new Date().toISOString() });
  list.sort((a, b) => depOf(a.it) - depOf(b.it));
  storeTrips(list); renderTrips(false);
}
async function refreshTrip(t) {
  const legs = [];
  for (const l of t.it.legs) { try { legs.push(await refreshLeg(api, l)); } catch { legs.push(l); } }
  t.it = { ...t.it, legs }; t.checked = new Date().toISOString();
}
let tripsBusy = false;
async function renderTrips(refresh) {
  // finished trips (arrived over an hour ago) disappear by themselves
  let list = savedTrips().filter(t => mins(arrOf(t.it), new Date()) < 60);
  storeTrips(list);
  $('#tripsSec').hidden = !list.length;
  const box = $('#trips'); box.replaceChildren();
  const m = +minT.value;
  for (const t of list) {
    const c = el('div', 'card trip');
    const top = el('div', 'top');
    const d = depOf(t.it), sameDay = d.toDateString() === new Date().toDateString();
    top.append(el('span', 'tt', `${hm(d)} → ${hm(arrOf(t.it))}`));
    top.append(el('span', 'sub', `${sameDay ? 'vandaag' : d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' })}`));
    const x = el('button', 'mini x', 'Verwijder');
    x.onclick = e => { e.stopPropagation(); storeTrips(savedTrips().filter(s => s.id !== t.id)); renderTrips(false); };
    top.append(x);
    const sub = el('div', 'sub', `${t.it.legs[0].from.name} → ${t.it.legs.at(-1).to.name} · gecheckt ${hm(new Date(t.checked))}`);
    const tr = transfers(t.it, m);
    const badges = el('div', 'badges');
    if (tr.some(z => !z.ok)) badges.append(el('span', 'b run', 'overstap haal je niet meer'));
    if (t.it.legs.some(l => l.missing)) badges.append(el('span', 'b run', 'trein niet meer gevonden'));
    const delay = Math.max(0, ...t.it.legs.map(l => l.from.planned && l.from.time ? mins(l.from.planned, l.from.time) : 0));
    if (delay > 0) badges.append(el('span', 'b warn', `+${delay} min`));
    const legs = drawLegs(t.it, m, { inTrainButtons: true }); legs.hidden = true;
    const acts = el('div', 'acts'); acts.hidden = true;
    const r = el('button', 'mini', '↻ Check opnieuw');
    r.onclick = async e => { e.stopPropagation(); r.textContent = 'Checken…'; await refreshTrip(t); const all = savedTrips().map(s => s.id === t.id ? t : s); storeTrips(all); renderTrips(false); };
    const share = el('button', 'mini', 'Delen'); share.onclick = e => { e.stopPropagation(); shareTrip(t.it); };
    acts.append(r, share);
    c.append(top, sub, badges, legs, acts);
    c.onclick = () => { legs.hidden = !legs.hidden; acts.hidden = legs.hidden; };
    box.append(c);
  }
  // re-check trips that leave within 3 hours when the app opens (at most every 2 minutes)
  if (refresh && api && !tripsBusy) {
    const due = list.filter(t => mins(new Date(), depOf(t.it)) < 180 && mins(new Date(t.checked), new Date()) >= 2);
    if (due.length) { tripsBusy = true; try { for (const t of due) await refreshTrip(t); const all = savedTrips().map(s => due.find(d => d.id === s.id) || s); storeTrips(all); } finally { tripsBusy = false; } renderTrips(false); }
  }
}

init();
</script>
</body>
</html>
