<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snel">
<title>Snel · treinplanner</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14202e;--mut:#627080;--line:#e1e6ec;--ns:#ffc917;--blue:#0063d3;--red:#d62828;--green:#1f8a4c}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--card:#18212b;--ink:#e8edf2;--mut:#93a1b0;--line:#26323e;--blue:#4c9bff;--red:#ff6b6b;--green:#4fc27e}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:#0b1a3a;color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;font-weight:750;letter-spacing:-.01em}header .dot{width:12px;height:12px;border-radius:50%;background:var(--ns)}
header button{margin-left:auto;background:none;border:0;color:#cfd8e6;font-size:15px}
main{max-width:560px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom) + 40px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.field{position:relative;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
.field:last-of-type{border-bottom:0}.field label{width:44px;color:var(--mut);font-size:14px}
.field input{flex:1;border:0;background:transparent;color:var(--ink);font-size:17px;padding:8px 0;outline:none;min-width:0}
.card{position:relative}
.swap{position:absolute;right:12px;top:42px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px}
.sug{position:absolute;left:44px;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:5;box-shadow:0 8px 24px #0003;max-height:260px;overflow:auto}
.sug div{padding:10px 12px;border-bottom:1px solid var(--line)}.sug div:last-child{border-bottom:0}.sug small{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row input[type=time]{font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--card)}
.slider{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--mut)}.slider input{flex:1}.slider b{color:var(--ink);min-width:52px;text-align:right}
.go{width:100%;margin-top:12px;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:650}
.go:disabled{opacity:.6}
.recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.recent .chip{white-space:nowrap}
.status{color:var(--mut);font-size:14px;margin:6px 4px 12px}.err{color:var(--red)}
.res{cursor:pointer}.res .top{display:flex;align-items:baseline;gap:8px}.res .tt{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.res .meta{margin-left:auto;color:var(--mut);font-size:14px;text-align:right}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.b{font-size:12.5px;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.b.gain{background:#1f8a4c22;border-color:var(--green);color:var(--green);font-weight:650}.b.run{background:#d6282822;border-color:var(--red);color:var(--red);font-weight:650}.b.ns{color:var(--mut)}
.legs{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.leg{display:grid;grid-template-columns:46px 14px 1fr auto;column-gap:8px;font-size:15px}
.leg .t{font-variant-numeric:tabular-nums;font-weight:650}.leg .bar{position:relative}.leg .bar::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:4px;background:var(--ns);border-radius:2px}
.leg .bar.w::before{background:repeating-linear-gradient(var(--mut) 0 4px,transparent 4px 8px)}
.trk{font-size:13px;border:1.5px solid var(--blue);color:var(--blue);border-radius:6px;padding:0 6px;height:22px;align-self:center;font-weight:650}
.train{grid-column:3/5;color:var(--mut);font-size:13.5px;padding:2px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.train button{font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:3px 8px}
.xfer{margin:4px 0 6px 54px;font-size:13.5px;color:var(--mut)}.xfer.run{color:var(--red);font-weight:600}
.cfg input{width:100%;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.cfg p{font-size:13.5px;color:var(--mut);margin:6px 0}
.mode{background:#0063d31a;border:1px solid var(--blue);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.mode button{margin-left:auto}
</style>
</head>
<body>
<header><span class="dot"></span><h1>Snel</h1><button id="cfgBtn" aria-label="Instellingen">Instellingen</button></header>
<main>
  <div class="card cfg" id="cfg" hidden>
    <b>Proxy-adres</b>
    <p>Het adres van je Cloudflare Worker, bijvoorbeeld https://ns-snel.jouwnaam.workers.dev</p>
    <input id="proxy" inputmode="url" autocomplete="off" placeholder="https://ns-snel.….workers.dev">
  </div>

  <div class="card">
    <div class="field"><label for="from">Van</label><input id="from" autocomplete="off" placeholder="Vertrekstation"><div class="sug" id="sugFrom" hidden></div></div>
    <button class="swap" id="swap" aria-label="Wissel van en naar">⇅</button>
    <div class="field"><label for="to">Naar</label><input id="to" autocomplete="off" placeholder="Aankomststation"><div class="sug" id="sugTo" hidden></div></div>
    <div class="row">
      <button class="chip" id="now" aria-pressed="true">Nu</button>
      <input type="time" id="time" aria-label="Vertrektijd">
    </div>
    <div class="slider"><span>Min. overstap</span><input type="range" id="minT" min="0" max="6" step="1"><b id="minTv"></b></div>
    <button class="go" id="go">Plan snelste route</button>
  </div>
  <div class="recent" id="recent"></div>
  <div id="mode"></div>
  <div class="status" id="status"></div>
  <div id="out"></div>
</main>
<script type="module">
import { makeApi, plan, depOf, arrOf, rides, transfers } from './planner.js';

const $ = s => document.querySelector(s);
const ls = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const hm = d => d ? d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : '–';
const dur = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let api = null, stations = [], sel = { from: ls.get('from', null), to: ls.get('to', null) };
let inTrain = null, last = null;

$('#proxy').value = ls.get('proxy', '');
$('#cfg').hidden = !!ls.get('proxy', '');
$('#cfgBtn').onclick = () => { $('#cfg').hidden = !$('#cfg').hidden; };
$('#proxy').onchange = () => { ls.set('proxy', $('#proxy').value.trim()); api = null; init(); };

const minT = $('#minT');
minT.value = ls.get('minT', 2);
const showMin = () => { $('#minTv').textContent = `${minT.value} min`; };
minT.oninput = () => { showMin(); ls.set('minT', +minT.value); };
showMin();

const nowBtn = $('#now'), timeIn = $('#time');
const setNow = on => { nowBtn.setAttribute('aria-pressed', on); if (on) timeIn.value = hm(new Date()); };
nowBtn.onclick = () => setNow(true);
timeIn.oninput = () => nowBtn.setAttribute('aria-pressed', false);
setNow(true);

function status(t, err) { const s = $('#status'); s.textContent = t || ''; s.className = 'status' + (err ? ' err' : ''); }

async function init() {
  const base = ls.get('proxy', '');
  if (!base) { status('Vul eerst bij Instellingen het adres van je proxy in.'); $('#cfg').hidden = false; return; }
  api = makeApi(base);
  try {
    status('Stations laden…');
    stations = (await api.loadStations()).filter(s => s.land === 'NL' || s.land === undefined);
    status('');
    if (sel.from) $('#from').value = sel.from.name;
    if (sel.to) $('#to').value = sel.to.name;
  } catch (e) { status('Kan de stations niet laden: ' + e.message + '. Klopt het proxy-adres?', true); }
}

function suggest(input, box, which) {
  let top = null;
  const pick = s => { sel[which] = s; ls.set(which, s); input.value = s.name; box.hidden = true; };
  const run = () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { box.hidden = true; return; }
    const hits = stations.map(s => {
      const names = [s.name, ...s.alt].map(n => n.toLowerCase());
      const score = names.some(n => n.startsWith(q)) ? 0 : s.code.toLowerCase() === q ? 0 : names.some(n => n.includes(q)) ? 1 : 9;
      return { s, score };
    }).filter(h => h.score < 9).sort((a, b) => a.score - b.score || a.s.name.length - b.s.name.length || a.s.name.localeCompare(b.s.name)).slice(0, 7);
    top = hits[0]?.s || null;
    box.replaceChildren(...hits.map(({ s }) => {
      const d = document.createElement('div');
      d.textContent = s.name;
      const sm = document.createElement('small'); sm.textContent = '  ' + s.code; d.append(sm);
      d.onpointerdown = e => { e.preventDefault(); pick(s); };
      return d;
    }));
    box.hidden = !hits.length;
  };
  input.oninput = () => { sel[which] = null; run(); };
  input.onfocus = () => { input.select(); };
  input.onkeydown = e => { if (e.key === 'Enter' && top) { e.preventDefault(); pick(top); input.blur(); } };
  // Leaving the field with a half-typed name takes the best suggestion.
  input.onblur = () => setTimeout(() => { box.hidden = true; if (!sel[which] && input.value.trim() && top) pick(top); }, 120);
}
suggest($('#from'), $('#sugFrom'), 'from');
suggest($('#to'), $('#sugTo'), 'to');

$('#swap').onclick = () => { [sel.from, sel.to] = [sel.to, sel.from]; ls.set('from', sel.from); ls.set('to', sel.to);
  $('#from').value = sel.from?.name || ''; $('#to').value = sel.to?.name || ''; };

function renderRecent() {
  const r = ls.get('recent', []);
  $('#recent').replaceChildren(...r.map(x => { const b = document.createElement('button'); b.className = 'chip';
    b.textContent = `${x.from.name} → ${x.to.name}`;
    b.onclick = () => { sel.from = x.from; sel.to = x.to; ls.set('from', x.from); ls.set('to', x.to); $('#from').value = x.from.name; $('#to').value = x.to.name; go(); };
    return b; }));
}
renderRecent();

function when() {
  if (nowBtn.getAttribute('aria-pressed') === 'true') return new Date();
  const [h, m] = (timeIn.value || '00:00').split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (d < new Date(Date.now() - 6 * 3600e3)) d.setDate(d.getDate() + 1);
  return d;
}

async function go(opts = {}) {
  if (!api) { await init(); if (!api) return; }
  if (!sel.from || !sel.to) { status('Kies een vertrek- en aankomststation uit de lijst.', true); return; }
  if (sel.from.code === sel.to.code) { status('Vertrek en aankomst zijn hetzelfde.', true); return; }
  const r = ls.get('recent', []).filter(x => !(x.from.code === sel.from.code && x.to.code === sel.to.code));
  ls.set('recent', [{ from: sel.from, to: sel.to }, ...r].slice(0, 5)); renderRecent();
  const btn = $('#go'); btn.disabled = true; $('#out').replaceChildren();
  status('Zoeken…');
  try {
    const m = +minT.value;
    const res = await plan(api, sel.from, sel.to, when(), m, { ...opts, onProgress: t => status(t) });
    last = res; renderResults(res, m);
    status(res.results.length ? `${res.results.length} routes · ${res.calls} NS-vragen` : 'Geen route gevonden.');
  } catch (e) { status('Zoeken mislukt: ' + e.message, true); }
  finally { btn.disabled = false; }
}
$('#go').onclick = () => { inTrain = null; renderMode(); go(); };

function renderMode() {
  const m = $('#mode'); m.replaceChildren();
  if (!inTrain) return;
  const d = document.createElement('div'); d.className = 'mode';
  d.textContent = `Je zit in ${inTrain.label}. Ik zoek waar je het best uitstapt.`;
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = 'Stop';
  b.onclick = () => { inTrain = null; renderMode(); };
  d.append(b); m.append(d);
}

function renderResults(res, m) {
  const out = $('#out'); out.replaceChildren();
  const nsArr = res.nsBest ? arrOf(res.nsBest) : null;
  res.results.forEach((it, idx) => {
    const c = document.createElement('div'); c.className = 'card res';
    const mins = Math.round((arrOf(it) - depOf(it)) / 60000);
    const tr = transfers(it, m);
    const gain = nsArr ? Math.round((nsArr - arrOf(it)) / 60000) : 0;
    const badges = [];
    if (gain > 0) badges.push(`<span class="b gain">${gain} min sneller dan NS</span>`);
    if (it.source === 'ns') badges.push('<span class="b ns">NS-advies</span>');
    if (tr.some(t => t.tight)) badges.push('<span class="b run">krappe overstap</span>');
    c.innerHTML = `<div class="top"><span class="tt">${hm(depOf(it))} → ${hm(arrOf(it))}</span>
      <span class="meta">${dur(mins)} · ${tr.length}× over</span></div><div class="badges">${badges.join('')}</div>`;
    const legs = document.createElement('div'); legs.className = 'legs'; legs.hidden = idx > 0;
    it.legs.forEach((l, i) => {
      const g = document.createElement('div'); g.className = 'leg';
      g.innerHTML = `<span class="t">${hm(l.from.time)}</span><span class="bar ${l.walk ? 'w' : ''}"></span><span>${esc(l.from.name)}</span>${l.from.track ? `<span class="trk">${esc(l.from.track)}</span>` : '<span></span>'}
        <span></span><span class="bar ${l.walk ? 'w' : ''}"></span><span class="train">${esc(l.walk ? l.label : `${l.cat || ''} ${l.direction ? 'richting ' + l.direction : ''}`)}</span>
        <span class="t">${hm(l.to.time)}</span><span class="bar ${l.walk ? 'w' : ''}" style="height:4px"></span><span>${esc(l.to.name)}</span>${l.to.track ? `<span class="trk">${esc(l.to.track)}</span>` : '<span></span>'}`;
      if (!l.walk) {
        const b = document.createElement('button'); b.textContent = 'Ik zit in deze trein';
        b.onclick = e => { e.stopPropagation(); inTrain = { label: `${l.cat} ${l.train} richting ${l.direction}` }; renderMode();
          go({ base: { legs: it.legs.slice(i), status: 'NORMAL', source: 'ns' }, after: new Date() }); };
        g.querySelector('.train').append(b);
      }
      legs.append(g);
      const t = tr.find(x => x.at === it.legs[i + 1]?.from.name);
      if (t && i < it.legs.length - 1) {
        const x = document.createElement('div'); x.className = 'xfer' + (t.tight ? ' run' : '');
        x.textContent = `${t.gap} min overstap${t.fromTrack && t.toTrack ? `, spoor ${t.fromTrack} → ${t.toTrack}` : ''}${t.same ? ' (zelfde spoor)' : t.tight ? ' · rennen' : ''}`;
        legs.append(x);
      }
    });
    c.append(legs);
    c.onclick = () => { legs.hidden = !legs.hidden; };
    out.append(c);
  });
}

init();
</script>
</body>
</html>
